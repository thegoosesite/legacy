<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", () => {
          // Get the current path (e.g., "/legacy/some-page")
          const currentPath = window.location.pathname;
          const path = currentPath.replace(/\/legacy(\/|$)/, '$1');
          window.location.replace("https://https://worshipthegoose.github.io" + path)
      });
    </script>
</head>
<body>
</body>
</html>
